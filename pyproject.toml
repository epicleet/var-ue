[project]
name = "var-ue"
version = "0.1.0"
description = "Verificador de Assinaturas de Resultados das Urnas Eletrônicas"
authors = [{ name = "Paulo Matias", email = "matias@ufscar.br" }]
license = "ISC"
requires-python = ">=3.10"
dependencies = [
    "asn1tools (>=0.169.0,<0.170.0)",
    "ecpy @ git+https://github.com/cslashm/ECPy.git",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
